<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script src="../scripts/settings-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Каталог букетов Lover Flower: цветы и композиции для любых событий." />
    <title>Каталог букетов — Lover Flower</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400&family=Oswald:wght@300;400;700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/catalog.css" />
  
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <link rel="stylesheet" href="../css/cart.css" />
    <script src="../scripts/components/app-header.js" defer></script>
    <script src="../scripts/components/app-footer.js" defer></script>
    <script src="../scripts/components/app-mobile-menu.js" defer></script>
    <script src="../scripts/components/app-callback-modal.js" defer></script>
    <script type="module" src="../scripts/components/app-auth-modal.js"></script>
    <script type="module" src="../scripts/components/app-cart-modal.js"></script>
    <script type="module" src="../scripts/pages/catalog.js"></script>
    <link rel="stylesheet" href="../css/orders.css" />
  <script type="module" src="../scripts/components/app-history-modal.js"></script>
    <link rel="stylesheet" href="../css/settings.css" />
    <script type="module" src="../scripts/components/app-settings.js"></script>
    <link rel="stylesheet" href="../css/notifications.css" />
    <script type="module" src="../scripts/components/app-notifications.js"></script>
  </head>
  <body class="catalog-page" >
    <a class="skip-link" href="#products">Перейти к букетам</a>
    <div class="catalog-backdrop" aria-hidden="true">
      <img
        src="../media/catalog/catalog-backdrop__flower--left.png"
        class="catalog-backdrop__flower catalog-backdrop__flower--left"
        alt=""
        aria-hidden="true" />
      <img
        src="../media/catalog/catalog-backdrop__flower--right.png"
        class="catalog-backdrop__flower catalog-backdrop__flower--right"
        alt=""
        aria-hidden="true" />
      <div class="catalog-glow catalog-glow--top">
        <img src="../media/catalog/catalog-glow--top.svg" class="" alt="" aria-hidden="true" />
      </div>
      <div class="catalog-glow catalog-glow--hero">
        <img src="../media/catalog/catalog-glow--hero.svg" class="" alt="" aria-hidden="true" />
      </div>
      <div class="catalog-glow catalog-glow--left-top">
        <img src="../media/catalog/catalog-glow--left-top.svg" class="" alt="" aria-hidden="true" />
      </div>
      <div class="catalog-glow catalog-glow--left-bottom">
        <img src="../media/catalog/catalog-glow--left-bottom.svg" class="" alt="" aria-hidden="true" />
      </div>
      <div class="catalog-glow catalog-glow--filter">
        <img src="../media/catalog/catalog-glow--filter.svg" class="" alt="" aria-hidden="true" />
      </div>
      <div class="catalog-glow catalog-glow--bottom-right">
        <img src="../media/catalog/catalog-glow--bottom-right.svg" class="" alt="" aria-hidden="true" />
      </div>
      <div class="catalog-glow catalog-glow--bottom">
        <img src="../media/catalog/catalog-glow--bottom.svg" class="" alt="" aria-hidden="true" />
      </div>
      <div class="catalog-glow catalog-glow--bottom-left">
        <img src="../media/catalog/catalog-glow--bottom-left.svg" class="" alt="" aria-hidden="true" />
      </div>
    </div>

    <app-header></app-header>
    

    <main class="catalog-main">
      <div class="container">
        <nav class="breadcrumbs">
          <a href="../index.html">Главная</a>
          <span aria-hidden="true">/</span>
          <span aria-current="page">Каталог</span>
        </nav>
        <section class="catalog-intro" aria-labelledby="catalog-title">
          <h1 id="catalog-title">
            <b data-i18n="catalog.title.first">Каталог</b>
            <span data-i18n="catalog.title.second">букетов</span>
          </h1>
          <p class="catalog-intro__description">В нашем магазине самый большой выбор букетов для любых событий:</p>
          <nav class="catalog-categories" aria-label="Категории букетов">
            <a href="catalog.html" data-category="">Все букеты</a>
            <a href="catalog.html?category=popular" data-category="popular">Популярное</a>
            <a href="catalog.html?category=roses" data-category="roses">Розы</a>
            <a href="catalog.html?category=peonies" data-category="peonies">Пионы</a>
            <a href="catalog.html?category=mixed" data-category="mixed">Сборные букеты</a>
            <a href="catalog.html?category=mono" data-category="mono">Монобукеты</a>
          </nav>
        </section>
        
        <div class="catalog-toolbar">
          <form class="catalog-query" role="search" data-catalog-search>
            <label class="sr-only" for="catalog-query">Название или состав букета</label>
            <input id="catalog-query" type="search" name="q" placeholder="Название или состав букета" maxlength="100" />
            <button type="submit">Найти</button>
          </form>
          <label class="sr-only" for="catalog-sort">Сортировка букетов</label>
          <div class="catalog-sort">
            <select id="catalog-sort" name="sort">
              <option value="popular">По популярности</option>
              <option value="price-asc">Сначала дешевле</option>
              <option value="price-desc">Сначала дороже</option>
              <option value="new">Сначала новинки</option>
            </select>
            <img src="../media/catalog/catalog-sort__down-arrow.svg" class="" alt="" aria-hidden="true" />
          </div>
        </div>
        <div class="catalog-layout">
          <aside class="catalog-filters" aria-label="Фильтры каталога">
            <details class="catalog-filter-details" open>
              <summary>Фильтры букетов</summary>
            <form class="catalog-filters__form">
              <fieldset class="filter-group">
                <legend>По свету</legend>
                <label class="filter-option">
                  <input type="checkbox" name="light" value="soft" />
                  <span>Нежные</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" name="light" value="bright" />
                  <span>Яркие</span>
                </label>
              </fieldset>
              <fieldset class="filter-group">
                <legend>По цвету</legend>
                <label class="filter-option">
                  <input type="checkbox" name="color" value="white" />
                  <span>Белый</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" name="color" value="yellow" />
                  <span>Желтый</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" name="color" value="green" />
                  <span>Зеленый</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" name="color" value="red" />
                  <span>Красный</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" name="color" value="orange" />
                  <span>Оранжевый</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" name="color" value="pink" />
                  <span>Розовый</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" name="color" value="blue" />
                  <span>Синий</span>
                </label>
              </fieldset>
              <fieldset class="filter-group">
                <legend>По формату</legend>
                <label class="filter-option">
                  <input type="checkbox" name="format" value="bouquet" />
                  <span>Букет</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" name="format" value="vase" />
                  <span>В вазе</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" name="format" value="envelope" />
                  <span>В конверте</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" name="format" value="basket" />
                  <span>В корзине</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" name="format" value="box" />
                  <span>В шляпной коробке</span>
                </label>
                <label class="filter-option">
                  <input type="checkbox" name="format" value="crate" />
                  <span>В ящике</span>
                </label>
              </fieldset>
              <fieldset class="filter-group filter-price">
                <legend>Стоимость</legend>
                
                <div class="filter-price__values">
                  <span>Цена:</span>
                  <label>
                    <span class="sr-only">Минимальная цена в рублях</span>
                    <input name="price-min" aria-describedby="price-error" type="number" min="0" step="0.01" placeholder="от" />
                  </label>
                  <span>₽ –</span>
                  <label>
                    <span class="sr-only">Максимальная цена в рублях</span>
                    <input name="price-max" aria-describedby="price-error" type="number" min="0" step="0.01" placeholder="до" />
                  </label>
                  <span>₽</span>
                </div>
              <p class="catalog-error" data-price-error id="price-error" role="status"></p></fieldset>
              <fieldset class="filter-group filter-flowers"><legend>По цветку</legend>
                <label class="filter-option"><input type="checkbox" name="flowers" value="rose" /><span>Роза</span></label>
                <label class="filter-option"><input type="checkbox" name="flowers" value="peony" /><span>Пион</span></label>
                <label class="filter-option"><input type="checkbox" name="flowers" value="gypsophila" /><span>Гипсофила</span></label>
                <label class="filter-option"><input type="checkbox" name="flowers" value="chrysanthemum" /><span>Хризантема</span></label>
                <label class="filter-option"><input type="checkbox" name="flowers" value="daisy" /><span>Ромашка</span></label>
              </fieldset>
              <button class="btn btn--outline filter-reset" type="reset">Сбросить фильтр</button>
            </form>
            </details>
          </aside>

          <section class="catalog-products" id="products" aria-labelledby="products-title">
            <h2 class="sr-only" id="products-title">Букеты</h2>
            <p class="catalog-status" data-catalog-status role="status" tabindex="-1">Загружаем букеты…</p>
            <button class="btn btn--outline" type="button" data-catalog-retry hidden>Повторить загрузку</button>
            <div class="catalog-product-grid" data-catalog-items></div>
            <nav class="catalog-pagination" data-pagination aria-label="Страницы каталога" hidden></nav>
          </section>
        </div>

        <div class="catalog-bottom">
          <a class="catalog-back-to-top" href="#top" aria-label="Вернуться наверх">
            <img src="../media/catalog/catalog-back-to-top.svg" class="" alt="" aria-hidden="true" />
          </a>
        </div>
      </div>
    </main>
    
    <app-footer></app-footer>
    <app-mobile-menu></app-mobile-menu>
    <app-callback-modal></app-callback-modal>
    <app-auth-modal></app-auth-modal>
    <app-cart-modal></app-cart-modal>
    <app-history-modal></app-history-modal>
    <app-settings></app-settings>
    <app-notifications></app-notifications>
  </body>
</html>
